name: CI/CD Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: SSH into EC2 and build
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Navigate to the root of the project (not just backend)
            cd ~/dotgrip-admin 

            # 2. Pull the latest code for the entire repo
            git pull origin main

            # 3. Shutdown current setup
            # We use the root docker-compose.yml now
            sudo docker compose down

            # 4. Aggressive cleanup to save space on EC2
            sudo docker system prune -af
            sudo docker volume prune -f

            # 5. Rebuild and restart everything
            # This will use the build args defined in your new compose file
            sudo docker compose up --build -d
