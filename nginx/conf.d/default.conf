server {
    listen 80;
    server_name 3.93.72.10;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 3.93.72.10;

    ssl_certificate /etc/letsencrypt/live/3.93.72.10/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3.93.72.10/privkey.pem;

    location /api/ {
        proxy_pass http://backend:8000/;
    }

    location / {
        proxy_pass http://frontend:3000/;
    }
}
